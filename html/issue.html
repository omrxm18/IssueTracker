<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Issue — Core Dump</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: var(--font);
            background-color: var(--bg);
            color: var(--text);
            max-width: 700px;
            margin: 40px auto;
            padding: 0 16px;
        }

        a {
            color: var(--link);
        }

        .nav {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            font-size: 0.9em;
        }

        h1 {
            margin: 0 0 8px;
            overflow-wrap: anywhere;
        }

        h1 .num {
            opacity: 0.55;
            font-weight: normal;
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
            font-size: 0.9em;
            margin-bottom: 16px;
            color: var(--text);
        }

        .tag {
            --c: var(--text);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 0.85em;
            font-weight: 600;
            text-transform: capitalize;
            color: var(--text);
            background: transparent;
            border: 1px solid color-mix(in srgb, var(--c) 70%, transparent);
        }

        .tag::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--c);
        }
        .tag.status-open { --c: #2e8b57; }
        .tag.status-in-progress { --c: #d99a00; }
        .tag.status-resolved,
        .tag.status-fixed,
        .tag.status-closed { --c: #8e5fe0; }
        .tag.status-wontfix,
        .tag.status-duplicate,
        .tag.status-invalid { --c: #8a8a8a; }
        .tag.sev-low { --c: #8a8a8a; }
        .tag.sev-high { --c: #e67e22; }
        .tag.sev-critical { --c: #d63a2a; }

        pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font: inherit;
            color: var(--text);
            background: color-mix(in srgb, var(--text) 8%, var(--bg));
            border: var(--border);
            padding: 12px;
            border-radius: 6px;
        }

        .error {
            color: #c0392b;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <button id="theme-toggle" class="theme-btn" aria-label="Toggle theme">
        <span id="theme-toggle-text">dark</span>
    </button>

    <div id="content" role="status" aria-live="polite">Loading…</div>

    <script>
        function esc(str) {
            if (str == null) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // "In Progress" / "in_progress" -> "in-progress", safe for use in a class name.
        function slug(str) {
            return String(str ?? '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
        }

        function fmtDate(raw) {
            const d = new Date(raw);
            if (isNaN(d)) return { text: esc(raw), iso: '', full: '' };
            return {
                text: d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }),
                iso: d.toISOString(),
                full: d.toLocaleString()
            };
        }

        const id = new URLSearchParams(location.search).get('id');
        const el = document.getElementById('content');

        function showError(msg) {
            el.innerHTML = `
    <div class="nav"><a href="/status.html">← All issues</a></div>
    <p class="error">${esc(msg)}</p>`;
            document.title = 'Issue — Core Dump';
        }

        async function load() {
            if (!id) { showError('No issue id given.'); return; }

            let res;
            try {
                res = await fetch('/api/issues/' + encodeURIComponent(id) + '/public');
            } catch {
                showError('Network error — reload the page to try again.');
                return;
            }
            if (res.status === 404) { showError('Issue not found.'); return; }
            if (!res.ok) { showError(`Could not load the issue (HTTP ${res.status}).`); return; }

            const r = await res.json().catch(() => null);
            if (!r || r.id === undefined) { showError('The server sent an unexpected response.'); return; }

            const date = fmtDate(r.created_at);
            document.title = `#${r.id}: ${r.title} — Core Dump`;

            el.innerHTML = `
    <div class="nav">
      <a href="/status.html?repo=${encodeURIComponent(r.repo)}">← ${esc(r.repo)} issues</a>
      <a href="/report.html?repo=${encodeURIComponent(r.repo)}">Report an issue</a>
    </div>
    <h1><span class="num">#${esc(r.id)}</span> ${esc(r.title)}</h1>
    <div class="meta">
      <span class="tag status-${esc(slug(r.status))}">${esc(r.status)}</span>
      <span>severity <span class="tag sev-${esc(slug(r.severity))}">${esc(r.severity)}</span></span>
      <span>opened <time datetime="${esc(date.iso)}" title="${esc(date.full)}">${date.text}</time></span>
    </div>
    <pre>${esc(r.body)}</pre>
    <p><a href="https://git.x01.dpdns.org/${esc(r.repo)}.git">View ${esc(r.repo)} on cgit →</a></p>
  `;
        }
        load();
    </script>
    <script src="script.js"></script>
</body>

</html>
