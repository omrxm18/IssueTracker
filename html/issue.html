<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Issues — Core Dump</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: var(--font);
            background-color: var(--bg);
            color: var(--text);
            max-width: 700px;
            margin: 40px auto;
            padding: 0 16px;
        }

        .meta {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 16px;
        }

        .badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85em;
        }

        pre {
            white-space: pre-wrap;
            background: #f6f6f6;
            padding: 12px;
            border-radius: 6px;
        }

        a {
            color: #06c;
        }
    </style>
</head>

<body>
    <div id="content">Loading…</div>

    <script>
        function esc(str) {
            if (str == null) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        const id = new URLSearchParams(location.search).get('id');
        const el = document.getElementById('content');

        async function load() {
            if (!id) { el.textContent = 'No issue id given.'; return; }
            const res = await fetch('/api/issues/' + id + '/public');
            if (res.status === 404) { el.textContent = 'Issue not found.'; return; }
            const r = await res.json();
            el.innerHTML = `
    <h1>#${r.id}: ${esc(r.title)}</h1>
    <div class="meta">
      <a href="/status.html?repo=${esc(r.repo)}">${esc(r.repo)}</a> ·
      severity: ${esc(r.severity)} ·
      status: <span class="badge">${esc(r.status)}</span> ·
      opened ${r.created_at}
    </div>
    <pre>${esc(r.body)}</pre>
    <p><a href="https://git.x01.dpdns.org/${esc(r.repo)}.git">View ${esc(r.repo)} on cgit →</a></p>
  `;
        }
        load();
    </script>
</body>

</html>
