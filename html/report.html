<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Report an Issue — Core Dump</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: var(--font);
            max-width: var(--max-width);
            margin: 40px auto;
            padding: 0 16px;
            color: var(--text);
            background-color: var(--bg);
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: 600;
            color: var(--text);
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            background-color: var(--text-input);
            border: var(--border);
            box-sizing: border-box;
        }

        textarea {
            min-height: 120px;
        }

        button {
            margin-top: 16px;
            padding: 10px 20px;
            cursor: pointer;
        }

        a {
            color: var(--link);
        }

        #honeypot {
            position: absolute;
            left: -9999px;
        }

        #status {
            margin-top: 12px;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <button id="theme-toggle" class="theme-btn" aria-label="Toggle theme">
        <span id="theme-toggle-text">dark</span>
    </button>
    <h1>Report an Issue</h1>
    <form id="issueForm">
        <label for="repo">Repository</label>
        <select id="repo" name="repo" required>
            <option value="">-- select --</option>
        </select>

        <label for="title">Title</label>
        <input type="text" id="title" name="title" required maxlength="200">

        <label for="body">Description</label>
        <textarea id="body" name="body" required></textarea>

        <label for="severity">Severity</label>
        <select id="severity" name="severity">
            <option value="low">Low</option>
            <option value="normal" selected>Normal</option>
            <option value="high">High</option>
            <option value="critical">Critical</option>
        </select>

        <label for="reporter_name">Your name (optional)</label>
        <input type="text" id="reporter_name" name="reporter_name">

        <label for="reporter_contact">Contact / email (optional)</label>
        <input type="text" id="reporter_contact" name="reporter_contact">

        <label style="display:flex; align-items:center; gap:8px; font-weight:normal;">
            <input type="checkbox" id="sensitive" name="sensitive" style="width:auto;">
            This is a security-sensitive issue — keep it private until reviewed
        </label>

        <input type="text" id="honeypot" name="honeypot" tabindex="-1" autocomplete="off">

        <button type="submit" id="submitBtn">Submit Report</button>
    </form>
    <br>
    Tracking an issue instead? go to <a href="/status.html">Status</a>
    <div id="status" role="status"></div>

    <script>
        const statusEl = document.getElementById('status');
        const repoEl = document.getElementById('repo');

        // The repo list comes from the server so the form and the API can't drift apart.
        (async () => {
            try {
                const res = await fetch('/api/repos');
                if (!res.ok) throw new Error();
                const repos = await res.json();
                for (const r of repos) {
                    const opt = document.createElement('option');
                    opt.value = r.slug;
                    opt.textContent = r.label;
                    repoEl.appendChild(opt);
                }
                const preRepo = new URLSearchParams(location.search).get('repo');
                if (preRepo) repoEl.value = preRepo.toLowerCase();
            } catch {
                statusEl.textContent = 'Could not load the repository list — reload the page.';
            }
        })();

        document.getElementById('issueForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const btn = document.getElementById('submitBtn');

            const data = Object.fromEntries(new FormData(form).entries());
            data.visibility = form.sensitive.checked ? 'internal' : 'public';
            delete data.sensitive; // checkbox state is already sent as `visibility`

            btn.disabled = true;
            statusEl.textContent = 'Submitting…';

            let res;
            try {
                res = await fetch('/api/issues', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            } catch {
                statusEl.textContent = 'Network error — try again.';
                btn.disabled = false;
                return;
            }

            // The server (or a proxy in front of it) may answer with non-JSON, e.g. a 502 page.
            const payload = await res.json().catch(() => null);

            if (res.ok && payload?.id !== undefined) {
                statusEl.textContent = `Thanks — issue #${payload.id} submitted.`;
                form.reset();
            } else {
                statusEl.textContent = `Error: ${payload?.error || `submission failed (HTTP ${res.status})`}`;
            }
            btn.disabled = false;
        });
    </script>
    <script src="script.js"></script>
</body>

</html>
